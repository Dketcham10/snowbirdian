name: Restart Pages certificate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restart-pages-certificate.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  restart:
    runs-on: ubuntu-latest
    steps:
      - name: Remove and restore the custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          repo="${{ github.repository }}"
          echo "BEFORE"
          gh api "repos/${repo}/pages" --jq '{cname, https_enforced, cert: .https_certificate}'

          echo "REMOVE"
          if ! gh api -X PUT "repos/${repo}/pages" --input - <<'EOF'
          {"cname": null}
          EOF
          then
            echo "REMOVE_FAILED"
            exit 1
          fi

          sleep 20

          echo "RESTORE"
          if ! gh api -X PUT "repos/${repo}/pages" --input - <<'EOF'
          {"cname": "www.snowbirdian.com"}
          EOF
          then
            echo "RESTORE_FAILED_RETRY"
            gh api -X PUT "repos/${repo}/pages" --input - <<'EOF'
          {"cname": "www.snowbirdian.com"}
          EOF
            exit 1
          fi

          sleep 10
          echo "AFTER"
          gh api "repos/${repo}/pages" --jq '{cname, https_enforced, cert: .https_certificate}'
