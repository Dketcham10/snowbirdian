name: Deploy Snowbirdian Hospitality to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # enablement flips Pages from the legacy branch build to Actions on first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # www.snowbirdian.com publishes the hospitality page only.
      # The SnowBirdian AI app stays in this repo and is not part of this deploy.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: second-serve

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
